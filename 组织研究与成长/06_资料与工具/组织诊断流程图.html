<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>组织诊断流程图</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf2f4;color:#173042;font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif}.sheet{max-width:1500px;margin:26px auto;padding:30px;background:#fff;box-shadow:0 4px 25px #17304214}.head{display:flex;justify-content:space-between;align-items:flex-end;margin:0 20px 10px}.kicker{color:#1f617b;font-size:13px;font-weight:700;letter-spacing:.14em}h1{font-size:35px;line-height:1.2;margin:8px 0 4px}.sub{font-size:14px;color:#506774}.tag{color:#1f617b;font-size:13px;font-weight:700;border:1px solid #b9d0da;border-radius:100px;padding:7px 13px}.diagram{width:100%;height:auto;display:block}.box{fill:#f7fafb;stroke:#92aebc;stroke-width:1.5}.box.focus{fill:#e9f3f7;stroke:#1f617b;stroke-width:2}.box.eval{fill:#fff7e5;stroke:#d8aa47;stroke-width:1.6}.box.done{fill:#e7f3ed;stroke:#4d9170;stroke-width:1.8}.diamond{fill:#fff7e5;stroke:#d8aa47;stroke-width:2}.line{fill:none;stroke:#2d647a;stroke-width:2.5;marker-end:url(#arrow)}.loop{fill:none;stroke:#b17929;stroke-width:2.3;stroke-dasharray:7 5;marker-end:url(#arrowAmber)}.step{font-size:16px;font-weight:700;fill:#1f617b}.title{font-size:24px;font-weight:700;fill:#173042}.body{font-size:16px;fill:#405967}.gate-title{font-size:20px;font-weight:700;fill:#654615;text-anchor:middle}.gate-body{font-size:14px;fill:#765b2a;text-anchor:middle}.arrow-label{font-size:15px;font-weight:700;fill:#32617a}.amber-label{font-size:15px;font-weight:700;fill:#956521}.footer{padding:0 20px 6px;color:#5d727e;font-size:13px}@media(max-width:760px){.sheet{margin:0;padding:8px}.head{display:block;margin:12px}.tag{display:inline-block;margin-top:10px}h1{font-size:27px}.diagram{min-width:1000px}.scroll{overflow-x:auto}}@media print{@page{size:A3 landscape;margin:9mm}body{background:#fff}.sheet{max-width:none;margin:0;padding:0;box-shadow:none}.head{margin:0 0 5px}h1{font-size:28px}.diagram{width:100%;min-width:0}.footer{font-size:11px;padding:0}}
</style></head><body><div class="sheet"><div class="head"><div><div class="kicker">ORGANIZATION DIAGNOSIS</div><h1>组织诊断流程图</h1><div class="sub">以一条需要交付结果的工作链为单位，从目标和真实流程推导岗位、编制与人岗差距</div></div><div class="tag">七步诊断主线</div></div><div class="scroll"><svg class="diagram" viewBox="0 0 1440 850" role="img" aria-label="组织诊断七步流程图：目标结果、必要工作、实际流程、根因判断、岗位权责、编制能力、人岗差距。事实证据不足则补充证据。">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2d647a"/></marker><marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b17929"/></marker></defs>

<rect class="box focus" x="25" y="62" width="400" height="138" rx="12"/><text class="step" x="49" y="92">01 目标结果</text><text class="title" x="49" y="127">明确要交付的结果</text><text class="body" x="49" y="158">结果口径、客户价值、期限与责任</text><text class="body" x="49" y="181">辨认要稳定形成的关键组织能力</text>
<rect class="box" x="520" y="62" width="400" height="138" rx="12"/><text class="step" x="544" y="92">02 必要工作</text><text class="title" x="544" y="127">倒推出必要工作</text><text class="body" x="544" y="158">从触发到结果关闭，标出交付物</text><text class="body" x="544" y="181">包含日常、项目高峰和风险工作</text>
<rect class="box" x="1015" y="62" width="400" height="138" rx="12"/><text class="step" x="1039" y="92">03 实际流程</text><text class="title" x="1039" y="127">沿案例核查实际流程</text><text class="body" x="1039" y="158">查成功、延期与异常事项的台账</text><text class="body" x="1039" y="181">定位等待、返工、交接与结果断点</text>
<path class="line" d="M425 131 H509"/><path class="line" d="M920 131 H1004"/>

<path class="line" d="M1215 200 V235"/><polygon class="diamond" points="1215,240 1350,320 1215,400 1080,320"/><text class="gate-title" x="1215" y="311">事实已核实？</text><text class="gate-body" x="1215" y="338">台账、访谈、实际行为</text><text class="gate-body" x="1215" y="358">能否相互印证</text>
<rect class="box eval" x="630" y="265" width="340" height="110" rx="12"/><text class="step" x="654" y="295">补充证据</text><text class="body" x="654" y="327">补看不同类型事项</text><text class="body" x="654" y="350">核对口径、样本与实际记录</text><path class="loop" d="M1080 320 H981"/><text class="amber-label" x="1009" y="307">否</text><path class="loop" d="M800 265 V224 H1070 V207"/>

<rect class="box focus" x="1015" y="455" width="400" height="148" rx="12"/><text class="step" x="1039" y="485">04 根因判断</text><text class="title" x="1039" y="520">区分表象与根因</text><text class="body" x="1039" y="551">查能力、思维、治理与外部限制</text><text class="body" x="1039" y="575">用相反证据检验主要原因</text>
<rect class="box" x="520" y="455" width="400" height="148" rx="12"/><text class="step" x="544" y="485">05 岗位权责</text><text class="title" x="544" y="520">明确分工与治理方式</text><text class="body" x="544" y="551">主责、授权、交接、信息与协同</text><text class="body" x="544" y="575">检验安排是否让人做得到</text>
<rect class="box" x="25" y="455" width="400" height="148" rx="12"/><text class="step" x="49" y="485">06 编制能力</text><text class="title" x="49" y="520">测算人数与专业能力</text><text class="body" x="49" y="551">按岗位汇总工时、峰值和备份</text><text class="body" x="49" y="575">确认人员是否会做、能稳定做</text>
<path class="line" d="M1215 400 V444"/><text class="arrow-label" x="1228" y="429">是</text><path class="line" d="M1015 529 H931"/><path class="line" d="M520 529 H436"/>

<rect class="box focus" x="520" y="673" width="400" height="145" rx="12"/><text class="step" x="544" y="705">07 人岗差距</text><text class="title" x="544" y="744">对照现有人岗</text><text class="body" x="544" y="775">区分数量、能力和配置差距</text><text class="body" x="544" y="800">明确相应的调整动作</text>
<rect class="box done" x="1015" y="685" width="400" height="123" rx="12"/><text class="step" x="1039" y="715">诊断输出</text><text class="title" x="1039" y="750">形成组织调整方案</text><text class="body" x="1039" y="780">岗位、编制、协同、培养与复核机制</text>
<path class="line" d="M225 603 V746 H509"/><path class="line" d="M920 746 H1004"/>
</svg></div><div class="footer">第4步只根据已核实的实际问题判断原因；完成第7步后，再汇总各工作链形成组织调整方案。</div></div></body></html>
